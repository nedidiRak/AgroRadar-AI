name: AgroRadar CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q -m "not slow"
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''

  backend_windows:
    name: Backend full regressions (Windows, Python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m pytest -q -m "not slow"
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''

  scale_500:
    name: Real API load test (500 created fields)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Create, persist and reread 500 real fields plus concurrent writes
        run: python -m pytest -q -s tests/test_scalability_500.py
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          AGRORADAR_AUTO_MONITOR: '0'
          AGRORADAR_WATER_CONTEXT: '0'

  frontend:
    name: Frontend build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_YANDEX_MAPS_API_KEY: ''

  dependency_audit:
    name: Python and Node dependency security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  browser_smoke:
    name: Chromium dashboard, six viewports, zoom and GIS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - name: Install frontend and Playwright controller
        working-directory: frontend
        run: npm ci
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Test real local FastAPI + React in Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agro-browser-data"
          env AGRORADAR_DATA_DIR="$RUNNER_TEMP/agro-browser-data" \
            AGRORADAR_ADMIN_PASSWORD='AgroRadar-Test-Only-Password!2026' \
            OPENWEATHER_API_KEY='' DEEPSEEK_API_KEY='' \
            AGRORADAR_AUTO_MONITOR='0' AGRORADAR_WATER_CONTEXT='0' \
            python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/agro-browser-api.log" 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev > "$RUNNER_TEMP/agro-browser-vite.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null &&
               curl -sf http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health >/dev/null
          curl -sf http://127.0.0.1:5173/ >/dev/null
          node frontend/tests/browser-smoke.mjs
          node frontend/tests/browser-responsive.mjs
          node frontend/tests/browser-workspace.mjs
          node frontend/tests/browser-widgets.mjs
      - name: Upload browser debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AgroRadar-browser-failures
          path: browser-failure-*.png
          if-no-files-found: ignore

  laptop_node22:
    name: Laptop frontend build (Windows, Node 22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_YANDEX_MAPS_API_KEY: ''

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows launcher environment
        working-directory: .
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt
      - name: Start the normal Windows application and verify its services
        working-directory: .
        shell: pwsh
        run: ./frontend/tests/windows-launcher.ps1

  wifi_windows:
    name: Wi-Fi demo smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python and QR dependencies
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: UI preferences and mobile defaults tests
        run: node --test tests/ui-preferences.test.mjs
        working-directory: frontend
      - name: Production frontend build
        run: npm run build
        working-directory: frontend
      - name: Offline Wi-Fi security and networking tests
        run: python -m pytest -q tests/test_wifi_demo.py
        working-directory: backend
      - name: Launch real LAN Uvicorn and smoke-test SPA / QR / login
        run: python tests/smoke_wifi_server.py
        working-directory: backend

  expert_portable:
    name: Expert portable Windows EXE (zero-install + CRUD smoke)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build expert frontend (public key loaded at runtime)
        working-directory: frontend
        env:
          VITE_YANDEX_MAPS_API_KEY: ''
        run: |
          npm ci
          npm run build
      - name: Install backend and Windows packager
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Freeze fully bundled local expert evaluator
        shell: pwsh
        run: .\packaging\build_expert.ps1
      - name: Real EXE startup and expert CRUD smoke
        env:
          DEEPSEEK_API_KEY: ''
          OPENWEATHER_API_KEY: ''
          AGRORADAR_WATER_CONTEXT: '0'
        run: python backend/tests/smoke_expert_portable.py
      - name: Upload READY-TO-SEND Windows expert archive
        uses: actions/upload-artifact@v4
        with:
          name: AgroRadar-Expert-Windows-v4
          path: dist/AgroRadar-Expert/
          if-no-files-found: error
          retention-days: 30
