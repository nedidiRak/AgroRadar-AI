name: AgroRadar CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q -m "not slow"
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''

  scale_500:
    name: Real API load test (500 created fields)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Create, persist and reread 500 real fields plus concurrent writes
        run: python -m pytest -q -s tests/test_scalability_500.py
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          AGRORADAR_AUTO_MONITOR: '0'
          AGRORADAR_WATER_CONTEXT: '0'

  frontend:
    name: Frontend build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/ui-preferences.test.mjs
      - run: npm run build
        env:
          VITE_YANDEX_MAPS_API_KEY: ''

  wifi_windows:
    name: Wi-Fi demo smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python and QR dependencies
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: UI preferences and mobile defaults tests
        run: node --test tests/ui-preferences.test.mjs
        working-directory: frontend
      - name: Production frontend build
        run: npm run build
        working-directory: frontend
      - name: Offline Wi-Fi security and networking tests
        run: python -m pytest -q tests/test_wifi_demo.py
        working-directory: backend
      - name: Launch real LAN Uvicorn and smoke-test SPA / QR / login
        run: python tests/smoke_wifi_server.py
        working-directory: backend

  expert_portable:
    name: Expert portable Windows EXE (zero-install + CRUD smoke)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build expert frontend (public key loaded at runtime)
        working-directory: frontend
        env:
          VITE_YANDEX_MAPS_API_KEY: ''
        run: |
          npm ci
          npm run build
      - name: Install backend and Windows packager
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Freeze fully bundled local expert evaluator
        shell: pwsh
        run: .\packaging\build_expert.ps1
      - name: Real EXE startup and expert CRUD smoke
        env:
          DEEPSEEK_API_KEY: ''
          OPENWEATHER_API_KEY: ''
          AGRORADAR_WATER_CONTEXT: '0'
        run: python backend/tests/smoke_expert_portable.py
      - name: Upload READY-TO-SEND Windows expert archive
        uses: actions/upload-artifact@v4
        with:
          name: AgroRadar-Expert-Windows-v4
          path: dist/AgroRadar-Expert/
          if-no-files-found: error
          retention-days: 30
