name: Build AgroRadar Expert macOS Apps

on:
  push:
    branches:
      - main
      - feature/mac-expert-app-20261120
    paths:
      - backend/**
      - frontend/**
      - DEMO_WIFI.command
      - packaging/**
      - .github/workflows/mac-expert.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mac_native_expert:
    name: Native macOS ${{ matrix.arch }} .app and real HTTP smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: AppleSilicon
          - os: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React with no private keys
        working-directory: frontend
        env:
          VITE_YANDEX_MAPS_API_KEY: ''
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Python and native macOS packager
        run: python -m pip install -r backend/requirements.txt 'pyinstaller>=6.16,<7'
      - name: Launch the source Wi-Fi demo and verify compressed assets over HTTP
        run: |
          python -m venv --system-site-packages backend/.venv
          python backend/tests/smoke_wifi_server.py --mac-launcher
      - name: Build and ad-hoc sign macOS app, ZIP preserving symlinks
        run: bash packaging/build_expert_mac.sh
      - name: Test extracted app with real localhost FastAPI, auth and CRUD
        env:
          OPENWEATHER_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          AGRORADAR_WATER_CONTEXT: '0'
        run: python backend/tests/smoke_expert_mac.py
      - name: Upload launchable Mac application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AgroRadar-Expert-macOS-${{ matrix.arch }}
          path: dist/AgroRadar-Expert-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
